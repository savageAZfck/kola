[package]
name = "kola"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/kola"
homepage = "https://github.com/savageAZfck/kola"
license = "MIT"
description = "Cross-organism witnessing: sovereign agents mutually notarize each other's hash-chained ledgers so neither side — not even its own owner — can rewrite attested history — named for Lakota kola, a sworn ally"
keywords = ["audit", "notarization", "witness", "sovereignty", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
